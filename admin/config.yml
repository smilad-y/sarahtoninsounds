# CMS edits commit to `main`, the production branch.
#
# Backend: GitHub, logged in through Netlify's built-in GitHub OAuth
# provider (Project configuration > Access & security > OAuth). Not the
# deprecated Netlify Identity + Git Gateway. The GitHub OAuth App's
# callback URL is https://api.netlify.com/auth/done, which works on
# previews and on the live domain alike, so it never changes.
# base_url / auth_endpoint are left at Decap's defaults (Netlify's auth
# service). site_domain pins the login to this Netlify project so it
# also works from deploy-preview and branch-deploy addresses.
#
# The old self-hosted login (netlify/functions/auth.js + callback.js)
# is no longer used. Left in place for now; do not point the OAuth App
# back at it without fixing callback.js, which posts the token to any
# opener window.
backend:
  name: github
  repo: smilad-y/sarahtoninsounds
  branch: main
  site_domain: sarahtoninsounds.com

# Uploads land inside assets/, which .eleventy.js already passthrough-
# copies to the published site (public/uploads was never copied, so
# uploaded images never appeared).
media_folder: assets/images/uploads
public_folder: /assets/images/uploads

collections:

  # ── SITE SETTINGS ──
  - name: settings
    label: "⚙️ Site Settings"
    files:

      - name: general
        label: "📢 Marquee & Themes"
        file: settings/general.json
        format: json
        fields:
          - { label: "Marquee Text", name: marquee_text, widget: string, hint: "The scrolling text at the top of the site. Use ✦ between phrases." }
          - label: "Theme Tags (sidebar)"
            name: themes
            widget: list
            field: { label: Tag, name: tag, widget: string }
            hint: "The clickable tags shown in the sidebar under Themes"

      - name: banner
        label: "🔔 Banner"
        file: settings/banner.json
        format: json
        fields:
          - { label: "Show Banner?", name: enabled, widget: boolean, default: false, hint: "Toggle the announcement bar at the top of the site" }
          - { label: "Banner Text", name: text, widget: string, hint: "The message shown in the banner" }
          - { label: "Link URL (optional)", name: link, widget: string, required: false, hint: "Leave blank for no link" }
          - { label: "Background Color", name: bg_color, widget: string, default: "#7b2d5e", hint: "Hex color, e.g. #7b2d5e" }
          - { label: "Text Color", name: text_color, widget: string, default: "#fde8c8", hint: "Hex color, e.g. #fde8c8" }

      - name: sidebar
        label: "📌 About This Place (Sidebar)"
        file: settings/sidebar.json
        format: json
        fields:
          - { label: "Sidebar Blurb", name: blurb, widget: text, hint: "Short text shown in the left sidebar under 'about this place'" }

      # settings/about.json (the legacy About bio) is deliberately no
      # longer editable from here — it's PRESERVE-only archived content
      # (CLAUDE.md), unrelated to the live About page's own copy, which
      # now has its own dedicated "about" collection below. The file
      # itself is untouched on disk.

      - name: wheel
        label: "🎡 Mood Wheel"
        file: settings/wheel.json
        format: json
        fields:
          - label: "Moods"
            name: moods
            widget: list
            hint: "Each mood becomes a wheel segment. Keep to 6–8 for best look."
            fields:
              - { label: "Mood Label", name: label, widget: string, hint: "e.g. nostalgic, euphoric, tender" }
              - { label: "Color", name: color, widget: string, hint: "Hex color for this segment, e.g. #7b4a8c" }
              - { label: "Why text", name: why, widget: string, hint: "Short description shown when wheel lands here" }

  # ── MUSIC SUPERVISION ──
  - name: supervision
    label: "🎬 Music Supervision"
    files:
      - name: supervision_content
        label: "Music Supervision Page"
        file: settings/supervision.json
        format: json
        fields:
          - { label: "Intro Paragraph", name: intro, widget: text }
          - { label: "Pull Quote", name: quote, widget: text }
          - label: "Pillars (key concepts)"
            name: pillars
            widget: list
            fields:
              - { label: "Label (small text above title)", name: label, widget: string }
              - { label: "Title", name: title, widget: string }
              - { label: "Body", name: body, widget: markdown }
          - label: "How It Works (steps)"
            name: steps
            widget: list
            fields:
              - { label: "Step Title", name: title, widget: string }
              - { label: "Step Description", name: body, widget: text }

  # ── LINKS ──
  - name: links_page
    label: "🔗 Links Page"
    files:
      - name: links_content
        label: "Links & Web Ring"
        file: settings/links.json
        format: json
        fields:
          - label: "Links"
            name: links
            widget: list
            fields:
              - { label: "Label", name: label, widget: string }
              - { label: "URL", name: url, widget: string, required: false, hint: "Leave blank to show as non-linked badge" }
          - { label: "Web Ring Label", name: webring_label, widget: string }
          - { label: "Web Ring Join Text", name: webring_email, widget: string }

  # ── ESSAYS ──
  - name: essays
    label: "✦ Essays"
    folder: essays
    create: true
    format: json
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Category", name: category, widget: string, default: essay }
      - { label: "Excerpt", name: excerpt, widget: text }
      - { label: "Body", name: body, widget: markdown }

  # ── MUSIC PICKS ──
  - name: music_picks
    label: "♪ Music Picks"
    files:
      - name: picks_index
        label: "All Music Picks"
        file: music-picks/index.json
        format: json
        fields:
          - label: "Picks"
            name: entries
            widget: list
            fields:
              - { label: "Song Title", name: title, widget: string }
              - { label: "Artist", name: artist, widget: string }
              - { label: "Year", name: year, widget: string, required: false }
              - { label: "Origin / Country", name: origin, widget: string, required: false }
              - label: "Genre Tags"
                name: genre
                widget: list
                field: { label: Genre, name: genre, widget: string }
              - { label: "Why this track?", name: why, widget: text }
              - { label: "Spotify URL", name: spotify, widget: string, required: false }

  # ── JOURNAL: ESSAYS ──
  # New Journal publishing system (PROJECT-SPEC.md §8). Distinct from the
  # legacy `essays` collection above, which remains PRESERVE-only and is
  # untouched. A real folder collection (one Markdown file per essay,
  # under content/journal/essays/) so Eleventy can build a native
  # `journalEssay` tag collection and generate a real /journal/<slug>/
  # page per entry — replaces the earlier single-JSON/list-widget shape.
  # `tags`/`layout`/`permalink` are implementation plumbing for the
  # Eleventy build, not something Sarah needs to set per essay, so
  # they're hidden fields with fixed defaults rather than exposed UI.
  - name: journal_essays
    label: "📓 Journal — Essays"
    folder: content/journal/essays
    create: true
    format: frontmatter
    extension: md
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Title", name: title, widget: string, hint: "Up to 40 characters. Titles of 16 characters or fewer get the big headline size on the Featured card; longer ones step down a size and wrap to two or three lines.", pattern: ['^.{1,40}$', 'Keep the title to 40 characters or fewer so it fits the Featured card.'] }
      - { label: "Slug", name: slug, widget: string, hint: "Used in the URL as /journal/<slug>/. Lowercase, hyphenated, must be unique across both Essays and Monthly Favorites." }
      - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Excerpt (summary)", name: excerpt, widget: text, hint: "One or two sentences, up to 160 characters (100 to 140 reads best). Shown on the Featured card and the Journal cards.", pattern: ['^[\s\S]{1,160}$', 'Keep the summary to 160 characters or fewer so it fits the Featured card.'] }
      - { label: "Featured Image", name: featured_image, widget: image, required: false, hint: "Best as a landscape image around 3:2, at least 1200 × 800 px (1500 × 1000 is ideal). It is cropped a little differently on the Featured card, the Journal cards, and mobile, so keep the main subject near the center. Portrait images work too but lose some of the top and bottom unless Show the whole Featured Image is on. JPG under 500 KB loads fastest." }
      - { label: "Show the whole Featured Image", name: featured_image_whole, widget: boolean, default: false, required: false, hint: "Turn on for polaroids and cut-outs so no edge gets cropped. Leave off for regular photos, which are cropped to fill the space." }
      - { label: "Category", name: category, widget: hidden, default: "Essay" }
      - { label: "Tags", name: tags, widget: hidden, default: "journalEssay" }
      - { label: "Layout", name: layout, widget: hidden, default: "layouts/journal-post.njk" }
      - { label: "Permalink", name: permalink, widget: hidden, default: "/journal/{{slug}}/" }
      - { label: "Body", name: body, widget: markdown, hint: "Renders into the Journal Post page's main body-copy block." }
      # Optional photo blocks on the Journal Post page. Each only renders
      # once an image is set. Hero sits above the body; the polaroids sit
      # below it on desktop.
      - label: "Hero Image (optional)"
        name: hero
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: "Image", name: image, widget: image, required: false, hint: "A wide banner above the post on desktop, cropped to about 2.6:1. Best at 2200 × 850 px, at least 1600 px wide. Mobile shows the whole image in a polaroid, so any shape works there. Use Image position to choose what stays visible when it is cropped." }
          - { label: "Image position", name: position, widget: select, options: ["top", "center", "bottom"], default: "center", required: false, hint: "Which part of the photo stays visible when it is cropped to fit. Use top for portraits so faces are not cut off." }
          - { label: "Alt text", name: alt, widget: string, required: false, hint: "Describe the photo for screen readers." }
          - { label: "Caption", name: caption, widget: string, required: false }
      - label: "Polaroid 1 (optional)"
        name: polaroid1
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: "Image", name: image, widget: image, required: false }
          - { label: "Alt text", name: alt, widget: string, required: false, hint: "Describe the photo for screen readers." }
          - { label: "Caption", name: caption, widget: string, required: false }
      - label: "Polaroid 2 (optional)"
        name: polaroid2
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: "Image", name: image, widget: image, required: false }
          - { label: "Alt text", name: alt, widget: string, required: false, hint: "Describe the photo for screen readers." }
          - { label: "Caption", name: caption, widget: string, required: false }

  # ── JOURNAL: FEATURED ──
  # Ordered, explicitly-curated Featured Journal selection (replaces the
  # old always-newest-entry behavior). Today's Journal Landing template
  # only uses the first entry (the single Featured Post slot); later
  # entries are reserved for a possible future multi-featured layout.
  - name: journal_featured
    label: "📌 Journal — Featured Post"
    files:
      - name: featured_list
        label: "Featured Selections"
        file: content/journal/featured.json
        format: json
        fields:
          - label: "Featured (in order — the first one shows in the Featured Post slot)"
            name: entries
            widget: list
            summary: "{{type}} — {{slug}}"
            fields:
              - { label: "Type", name: type, widget: select, options: ["essay", "monthly-fav"] }
              - { label: "Slug", name: slug, widget: string, hint: "Must exactly match that entry's own Slug field." }

  # ── JOURNAL: MONTHLY FAVORITES ──
  # Same publishing system as Journal Essays above, but keeps its own
  # structured sections rather than a single markdown body.
  - name: journal_monthly_favorites
    label: "📓 Journal — Monthly Favorites"
    files:
      - name: monthly_favorites_list
        label: "All Monthly Favorites"
        file: content/journal/monthly-favorites.json
        format: json
        fields:
          - label: "Monthly Favorites Entries"
            name: entries
            widget: list
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Title", name: title, widget: string, hint: "e.g. August Favorites. Up to 40 characters. Titles of 16 characters or fewer get the big headline size on the Featured card; longer ones step down a size and wrap to two or three lines.", pattern: ['^.{1,40}$', 'Keep the title to 40 characters or fewer so it fits the Featured card.'] }
              - { label: "Slug", name: slug, widget: string, hint: "Used in the URL as /journal/<slug>. Lowercase, hyphenated, must be unique across both Essays and Monthly Favorites." }
              - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Excerpt (summary)", name: excerpt, widget: text, hint: "One or two sentences, up to 160 characters (100 to 140 reads best). Shown on the Featured card and the Journal cards.", pattern: ['^[\s\S]{1,160}$', 'Keep the summary to 160 characters or fewer so it fits the Featured card.'] }
              - { label: "Featured Image", name: featured_image, widget: image, required: false, hint: "Best as a landscape image around 3:2, at least 1200 × 800 px (1500 × 1000 is ideal). It is cropped a little differently on the Featured card, the Journal cards, and mobile, so keep the main subject near the center. Portrait images work too but lose some of the top and bottom unless Show the whole Featured Image is on. JPG under 500 KB loads fastest." }
              - { label: "Show the whole Featured Image", name: featured_image_whole, widget: boolean, default: false, required: false, hint: "Turn on for polaroids and cut-outs so no edge gets cropped. Leave off for regular photos, which are cropped to fill the space." }
              - label: "Hero Image (optional)"
                name: hero
                widget: object
                required: false
                collapsed: true
                fields:
                  - { label: "Image", name: image, widget: image, required: false, hint: "A wide banner above the post on desktop, cropped to about 2.6:1. Best at 2200 × 850 px, at least 1600 px wide. Mobile shows the whole image in a polaroid, so any shape works there. Use Image position to choose what stays visible when it is cropped." }
                  - { label: "Image position", name: position, widget: select, options: ["top", "center", "bottom"], default: "center", required: false, hint: "Which part of the photo stays visible when it is cropped to fit. Use top for portraits so faces are not cut off." }
                  - { label: "Alt text", name: alt, widget: string, required: false, hint: "Describe the photo for screen readers." }
                  - { label: "Caption", name: caption, widget: string, required: false }
              - label: "Polaroid 1 (optional)"
                name: polaroid1
                widget: object
                required: false
                collapsed: true
                fields:
                  - { label: "Image", name: image, widget: image, required: false }
                  - { label: "Alt text", name: alt, widget: string, required: false, hint: "Describe the photo for screen readers." }
                  - { label: "Caption", name: caption, widget: string, required: false }
              - label: "Polaroid 2 (optional)"
                name: polaroid2
                widget: object
                required: false
                collapsed: true
                fields:
                  - { label: "Image", name: image, widget: image, required: false }
                  - { label: "Alt text", name: alt, widget: string, required: false, hint: "Describe the photo for screen readers." }
                  - { label: "Caption", name: caption, widget: string, required: false }
              - label: "New Releases I Loved"
                name: new_releases
                widget: list
                required: false
                fields:
                  - { label: "Song Title", name: title, widget: string }
                  - { label: "Artist", name: artist, widget: string }
                  - { label: "Note", name: note, widget: text, required: false }
              - label: "Favorite Songs"
                name: favorite_songs
                widget: list
                required: false
                fields:
                  - { label: "Song Title", name: title, widget: string }
                  - { label: "Artist", name: artist, widget: string }
                  - { label: "Note", name: note, widget: text, required: false }
              - label: "Favorite Discoveries"
                name: favorite_discoveries
                widget: list
                required: false
                fields:
                  - { label: "Song Title", name: title, widget: string }
                  - { label: "Artist", name: artist, widget: string }
                  - { label: "Note", name: note, widget: text, required: false }
              - label: "Favorite Needledrops"
                name: favorite_needledrops
                widget: list
                required: false
                fields:
                  - { label: "Song Title", name: title, widget: string }
                  - { label: "Artist", name: artist, widget: string }
                  - { label: "Note", name: note, widget: text, required: false }

  # ── CRASH COURSES ──
  # Listen's Crash Courses (PROJECT-SPEC.md §7): curated introductions to
  # a genre, artist, scene, or sound. Separate from the mood data in
  # content/listen/moods.json. A folder collection like Journal Essays:
  # one Markdown file per course, and the file name (set from the title
  # when the entry is created) is its URL, /listen/crash-courses/<slug>/.
  # Entries with Live off appear nowhere on the site. The folder's data
  # file (crash-courses.11tydata.js) handles the URL, so tags/layout are
  # the only hidden plumbing here.
  - name: crash_courses
    label: "🎧 Crash Courses"
    label_singular: "Crash Course"
    folder: content/listen/crash-courses
    create: true
    format: frontmatter
    extension: md
    slug: "{{slug}}"
    summary: "{{title}} (order {{order}}, live: {{live}})"
    sortable_fields: ["order", "title"]
    fields:
      - { label: "Title", name: title, widget: string, hint: "What the course is about. Shown after \"a crash course in\" on the course page, and on the cards. The page URL is made from this title when you first save, and stays the same if you edit the title later." }
      - { label: "Card art", name: card_art, widget: image, hint: "Square, at least 1200 × 1200 px. Shown taped onto the cards and on the course page, cropped to a square." }
      - { label: "Art description", name: card_art_alt, widget: string, hint: "Describe the card art for screen readers." }
      - { label: "Hook", name: hook, widget: string, required: false, hint: "One short line shown under the title on the cards." }
      - { label: "Intro", name: body, widget: markdown, required: false, hint: "Shown under the title on the course page." }
      - { label: "Spotify playlist URL", name: spotify_url, widget: string, pattern: ['^https://open\.spotify\.com/playlist/[A-Za-z0-9]+', 'Paste a Spotify playlist link, like https://open.spotify.com/playlist/...'], hint: "The course page plays this playlist." }
      - { label: "Apple Music playlist URL", name: apple_music_url, widget: string, required: false, pattern: ['^https://music\.apple\.com/', 'Paste an Apple Music playlist link, like https://music.apple.com/...'], hint: "Optional. When set, the course page shows a Spotify / Apple Music toggle." }
      - label: "Start here"
        name: start_here
        widget: list
        required: false
        summary: "{{track}} by {{artist}}"
        fields:
          - { label: "Track", name: track, widget: string }
          - { label: "Artist", name: artist, widget: string }
          - { label: "Note", name: note, widget: string, required: false, hint: "A short handwritten note beside the track." }
      - { label: "Live", name: live, widget: boolean, default: false, required: false, hint: "Off: the course appears nowhere on the site. On: it shows on Listen, the Crash Courses page, and at its own URL." }
      - { label: "Order", name: order, widget: number, value_type: int, required: false, hint: "Lower numbers show first on Listen and the Crash Courses page." }
      - { label: "Tags", name: tags, widget: hidden, default: "crashCourse" }
      - { label: "Layout", name: layout, widget: hidden, default: "layouts/crash-course.njk" }

  # ── LISTEN MOODS ──
  # content/listen/mood-words.json: each mood's descriptor, blurb,
  # description, and Sarah's Picks (PROJECT-SPEC.md §7). Colors, art,
  # live flags, playlist URLs, and order stay in moods.json, which is
  # not in the CMS at all. They are separate files because Decap rewrites
  # any object with more than eight keys in a scrambled key order; every
  # object in mood-words.json stays under that. id and name are hidden:
  # id links an entry to its mood, name labels it in the list. Moods
  # can't be added, removed, or reordered here.
  - name: listen
    label: "🎧 Listen Moods"
    editor: { preview: false }
    files:
      - name: moods
        label: "Moods"
        file: content/listen/mood-words.json
        format: json
        fields:
          - label: "Moods"
            name: moods
            widget: list
            allow_add: false
            allow_remove: false
            allow_reorder: false
            collapsed: true
            summary: "{{fields.name}}"
            hint: "Click a mood to edit its words and picks. Colors, art, playlists, order, and which moods are live are not edited here."
            fields:
              - { label: "Mood ID", name: id, widget: hidden }
              - { label: "Mood", name: name, widget: hidden }
              - { label: "Descriptor", name: descriptor, widget: string, required: false, hint: "The short line on the mood's circle in the selector. UNDECIDED or blank shows nothing." }
              - { label: "Blurb", name: blurb, widget: string, required: false, hint: "The handwritten line beside the turntable. UNDECIDED or blank shows nothing." }
              - { label: "Description", name: description, widget: text, required: false, hint: "The paragraph under the blurb. UNDECIDED or blank shows nothing." }
              - label: "Sarah's Picks"
                name: picks
                widget: list
                required: false
                label_singular: "pick"
                summary: "{{fields.title}} - {{fields.artist}}"
                hint: "Shown in this order on the Sarah's Picks note. Drag to reorder."
                fields:
                  - { label: "Song Title", name: title, widget: string }
                  - { label: "Artist", name: artist, widget: string }

  # ── HOME (current site) ──
  # content/home.json. The ticker runs along the navy band on Home; the
  # site adds the ✶ between phrases and loops them.
  - name: home
    label: "🏠 Home (current site)"
    files:
      - name: home_content
        label: "Home Page Settings"
        file: content/home.json
        format: json
        fields:
          - label: "Ticker"
            name: ticker
            widget: object
            fields:
              - { label: "Show the ticker?", name: enabled, widget: boolean, default: true, hint: "Off hides the ticker. It also stays hidden when the list below is empty." }
              - label: "Phrases"
                name: phrases
                widget: list
                required: false
                hint: "Short phrases, plain text. The ✶ between them is added for you."
                field: { label: "Phrase", name: phrase, widget: string }

  # ── ABOUT (current site) ──
  # content/about.json — the live About page's own copy (PROJECT-SPEC.md
  # §9). Distinct from the legacy settings/about.json bio above (removed
  # from this CMS's UI, PRESERVE-only). One bio is shared by desktop and
  # mobile; the remaining _desktop/_mobile pairs are formatted
  # differently per layout, so they stay separately editable.
  - name: about
    label: "👤 About (current site)"
    files:
      - name: about_content
        label: "About Page Content"
        file: content/about.json
        format: json
        fields:
          - label: "Desktop — Title Block"
            name: hero_desktop
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Heading Subtitle", name: heading_sub, widget: string }
          - label: "Desktop — Greeting"
            name: greeting_desktop
            widget: object
            fields:
              - { label: "Line 1", name: line1, widget: string }
              - { label: "Line 2", name: line2, widget: string }
          - label: "Mobile — Greeting"
            name: greeting_mobile
            widget: object
            fields:
              - { label: "Line 1", name: line1, widget: string }
              - { label: "Line 2", name: line2, widget: string }
          - label: "Bio (desktop and mobile)"
            name: bio
            widget: list
            summary: "{{text}}"
            fields:
              - { label: "Kind", name: kind, widget: hidden, default: "paragraph" }
              - { label: "Text", name: text, widget: text }
          - { label: "Polaroid Photo Caption (shared, desktop + mobile)", name: photo_caption, widget: string }
          - label: "Desktop — CTA"
            name: cta_desktop
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Body", name: body, widget: text }
          - label: "Resume"
            name: resume
            widget: object
            fields:
              - { label: "Heading (desktop)", name: heading_desktop, widget: string }
              - { label: "Heading (mobile)", name: heading_mobile, widget: string }
              - label: "Entries"
                name: entries
                widget: list
                fields:
                  - { label: "Title", name: title, widget: string }
                  - { label: "Role", name: role, widget: string }
                  - { label: "Dates (desktop)", name: dates_desktop, widget: string }
                  - { label: "Dates (mobile)", name: dates_mobile, widget: string }
          - label: "Mobile — Footer"
            name: footer_mobile
            widget: object
            fields:
              - { label: "Tagline", name: tagline, widget: string }
