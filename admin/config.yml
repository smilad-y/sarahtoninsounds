# ⚠️ TEMPORARY DEVELOPMENT SETTING — DO NOT SHIP AS-IS ⚠️
# backend.branch below is pointed at the in-progress Journal rebuild
# branch (claude/add-claude-md-file-3fgnk0) so that any CMS use during
# development writes only to this branch — never to `main`, which still
# serves the legacy site and must not receive Journal dev content.
# Before this rebuild becomes production, this value MUST be changed to
# the real production branch, and the corresponding Netlify site must
# have Identity + Git Gateway enabled for that branch. Production-branch
# cutover is a separate launch task, not assumed to be this branch.
backend:
  name: git-gateway
  branch: claude/add-claude-md-file-3fgnk0

media_folder: public/uploads
public_folder: /public/uploads

collections:

  # ── SITE SETTINGS ──
  - name: settings
    label: "⚙️ Site Settings"
    files:

      - name: general
        label: "📢 Marquee & Themes"
        file: settings/general.json
        format: json
        fields:
          - { label: "Marquee Text", name: marquee_text, widget: string, hint: "The scrolling text at the top of the site. Use ✦ between phrases." }
          - label: "Theme Tags (sidebar)"
            name: themes
            widget: list
            field: { label: Tag, name: tag, widget: string }
            hint: "The clickable tags shown in the sidebar under Themes"

      - name: banner
        label: "🔔 Banner"
        file: settings/banner.json
        format: json
        fields:
          - { label: "Show Banner?", name: enabled, widget: boolean, default: false, hint: "Toggle the announcement bar at the top of the site" }
          - { label: "Banner Text", name: text, widget: string, hint: "The message shown in the banner" }
          - { label: "Link URL (optional)", name: link, widget: string, required: false, hint: "Leave blank for no link" }
          - { label: "Background Color", name: bg_color, widget: string, default: "#7b2d5e", hint: "Hex color, e.g. #7b2d5e" }
          - { label: "Text Color", name: text_color, widget: string, default: "#fde8c8", hint: "Hex color, e.g. #fde8c8" }

      - name: sidebar
        label: "📌 About This Place (Sidebar)"
        file: settings/sidebar.json
        format: json
        fields:
          - { label: "Sidebar Blurb", name: blurb, widget: text, hint: "Short text shown in the left sidebar under 'about this place'" }

      - name: about
        label: "👤 About Me"
        file: settings/about.json
        format: json
        fields:
          - { label: "Bio", name: bio, widget: markdown, hint: "Supports **bold**, *italic*, paragraphs" }
          - { label: "Location", name: location, widget: string, required: false }
          - { label: "Credentials / extra line", name: credentials, widget: string, required: false, hint: "e.g. Guild of Music Supervisors member · UCLA Extension cert" }
          - { label: "Email (shown as postcard)", name: email, widget: string, required: false }

      - name: wheel
        label: "🎡 Mood Wheel"
        file: settings/wheel.json
        format: json
        fields:
          - label: "Moods"
            name: moods
            widget: list
            hint: "Each mood becomes a wheel segment. Keep to 6–8 for best look."
            fields:
              - { label: "Mood Label", name: label, widget: string, hint: "e.g. nostalgic, euphoric, tender" }
              - { label: "Color", name: color, widget: string, hint: "Hex color for this segment, e.g. #7b4a8c" }
              - { label: "Why text", name: why, widget: string, hint: "Short description shown when wheel lands here" }

  # ── MUSIC SUPERVISION ──
  - name: supervision
    label: "🎬 Music Supervision"
    files:
      - name: supervision_content
        label: "Music Supervision Page"
        file: settings/supervision.json
        format: json
        fields:
          - { label: "Intro Paragraph", name: intro, widget: text }
          - { label: "Pull Quote", name: quote, widget: text }
          - label: "Pillars (key concepts)"
            name: pillars
            widget: list
            fields:
              - { label: "Label (small text above title)", name: label, widget: string }
              - { label: "Title", name: title, widget: string }
              - { label: "Body", name: body, widget: markdown }
          - label: "How It Works (steps)"
            name: steps
            widget: list
            fields:
              - { label: "Step Title", name: title, widget: string }
              - { label: "Step Description", name: body, widget: text }

  # ── LINKS ──
  - name: links_page
    label: "🔗 Links Page"
    files:
      - name: links_content
        label: "Links & Web Ring"
        file: settings/links.json
        format: json
        fields:
          - label: "Links"
            name: links
            widget: list
            fields:
              - { label: "Label", name: label, widget: string }
              - { label: "URL", name: url, widget: string, required: false, hint: "Leave blank to show as non-linked badge" }
          - { label: "Web Ring Label", name: webring_label, widget: string }
          - { label: "Web Ring Join Text", name: webring_email, widget: string }

  # ── ESSAYS ──
  - name: essays
    label: "✦ Essays"
    folder: essays
    create: true
    format: json
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Date", name: date, widget: date, format: YYYY-MM-DD }
      - { label: "Category", name: category, widget: string, default: essay }
      - { label: "Excerpt", name: excerpt, widget: text }
      - { label: "Body", name: body, widget: markdown }

  # ── MUSIC PICKS ──
  - name: music_picks
    label: "♪ Music Picks"
    files:
      - name: picks_index
        label: "All Music Picks"
        file: music-picks/index.json
        format: json
        fields:
          - label: "Picks"
            name: entries
            widget: list
            fields:
              - { label: "Song Title", name: title, widget: string }
              - { label: "Artist", name: artist, widget: string }
              - { label: "Year", name: year, widget: string, required: false }
              - { label: "Origin / Country", name: origin, widget: string, required: false }
              - label: "Genre Tags"
                name: genre
                widget: list
                field: { label: Genre, name: genre, widget: string }
              - { label: "Why this track?", name: why, widget: text }
              - { label: "Spotify URL", name: spotify, widget: string, required: false }

  # ── JOURNAL: ESSAYS ──
  # New Journal publishing system (PROJECT-SPEC.md §8). Distinct from the
  # legacy `essays` collection above, which remains PRESERVE-only and is
  # untouched. Single-file/list-widget pattern (matches music_picks above)
  # so publishing never requires a manually-maintained index file.
  - name: journal_essays
    label: "📓 Journal — Essays"
    files:
      - name: essays_list
        label: "All Essays"
        file: content/journal/essays.json
        format: json
        fields:
          - label: "Essays"
            name: entries
            widget: list
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Slug", name: slug, widget: string, hint: "Used in the URL as /journal/<slug>. Lowercase, hyphenated, must be unique across both Essays and Monthly Favorites." }
              - { label: "Date", name: date, widget: date, format: "YYYY-MM-DD" }
              - { label: "Excerpt", name: excerpt, widget: text, hint: "Short teaser shown on the Journal card." }
              - { label: "Featured Image", name: featured_image, widget: image, required: false }
              - { label: "Body", name: body, widget: markdown }

  # ── JOURNAL: MONTHLY FAVORITES ──
  # Same publishing system as Journal Essays above, but keeps its own
  # structured sections rather than a single markdown body.
  - name: journal_monthly_favorites
    label: "📓 Journal — Monthly Favorites"
    files:
      - name: monthly_favorites_list
        label: "All Monthly Favorites"
        file: content/journal/monthly-favorites.json
        format: json
        fields:
          - label: "Monthly Favorites Entries"
            name: entries
            widget: list
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Title", name: title, widget: string, hint: "e.g. August Favorites" }
              - { label: "Slug", name: slug, widget: string, hint: "Used in the URL as /journal/<slug>. Lowercase, hyphenated, must be unique across both Essays and Monthly Favorites." }
              - { label: "Date", name: date, widget: date, format: "YYYY-MM-DD" }
              - { label: "Excerpt", name: excerpt, widget: text, hint: "Short teaser shown on the Journal card." }
              - { label: "Featured Image", name: featured_image, widget: image, required: false }
              - label: "New Releases I Loved"
                name: new_releases
                widget: list
                required: false
                fields:
                  - { label: "Song Title", name: title, widget: string }
                  - { label: "Artist", name: artist, widget: string }
                  - { label: "Note", name: note, widget: text, required: false }
              - label: "Favorite Songs"
                name: favorite_songs
                widget: list
                required: false
                fields:
                  - { label: "Song Title", name: title, widget: string }
                  - { label: "Artist", name: artist, widget: string }
                  - { label: "Note", name: note, widget: text, required: false }
              - label: "Favorite Discoveries"
                name: favorite_discoveries
                widget: list
                required: false
                fields:
                  - { label: "Song Title", name: title, widget: string }
                  - { label: "Artist", name: artist, widget: string }
                  - { label: "Note", name: note, widget: text, required: false }
              - label: "Favorite Needledrops"
                name: favorite_needledrops
                widget: list
                required: false
                fields:
                  - { label: "Song Title", name: title, widget: string }
                  - { label: "Artist", name: artist, widget: string }
                  - { label: "Note", name: note, widget: text, required: false }
