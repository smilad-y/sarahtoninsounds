# ⚠️ TEMPORARY DEVELOPMENT SETTING — DO NOT SHIP AS-IS ⚠️
# backend.branch below is pointed at the in-progress Journal rebuild
# branch (claude/add-claude-md-file-3fgnk0) so that any CMS use during
# development writes only to this branch — never to `main`, which still
# serves the legacy site and must not receive Journal dev content.
# Before this rebuild becomes production, this value MUST be changed to
# the real production branch. Production-branch cutover is a separate
# launch task, not assumed to be this branch.
#
# Backend: GitHub, logged in through Netlify's built-in GitHub OAuth
# provider (Project configuration > Access & security > OAuth). Not the
# deprecated Netlify Identity + Git Gateway. The GitHub OAuth App's
# callback URL is https://api.netlify.com/auth/done, which works on
# previews and on the live domain alike, so it never changes.
# base_url / auth_endpoint are left at Decap's defaults (Netlify's auth
# service). site_domain pins the login to this Netlify project so it
# also works from deploy-preview and branch-deploy addresses.
#
# At launch: change `branch` to the production branch (see the warning
# above). site_domain can stay as the netlify.app name, or become
# sarahtoninsounds.com once that domain is attached to this project.
#
# The old self-hosted login (netlify/functions/auth.js + callback.js)
# is no longer used. Left in place for now; do not point the OAuth App
# back at it without fixing callback.js, which posts the token to any
# opener window.
backend:
  name: github
  repo: smilad-y/sarahtoninsounds
  branch: claude/add-claude-md-file-3fgnk0
  site_domain: cool-sfogliatella-be8fb5.netlify.app

# Uploads land inside assets/, which .eleventy.js already passthrough-
# copies to the published site (public/uploads was never copied, so
# uploaded images never appeared).
media_folder: assets/images/uploads
public_folder: /assets/images/uploads

collections:

  # ── SITE SETTINGS ──
  - name: settings
    label: "⚙️ Site Settings"
    files:

      - name: general
        label: "📢 Marquee & Themes"
        file: settings/general.json
        format: json
        fields:
          - { label: "Marquee Text", name: marquee_text, widget: string, hint: "The scrolling text at the top of the site. Use ✦ between phrases." }
          - label: "Theme Tags (sidebar)"
            name: themes
            widget: list
            field: { label: Tag, name: tag, widget: string }
            hint: "The clickable tags shown in the sidebar under Themes"

      - name: banner
        label: "🔔 Banner"
        file: settings/banner.json
        format: json
        fields:
          - { label: "Show Banner?", name: enabled, widget: boolean, default: false, hint: "Toggle the announcement bar at the top of the site" }
          - { label: "Banner Text", name: text, widget: string, hint: "The message shown in the banner" }
          - { label: "Link URL (optional)", name: link, widget: string, required: false, hint: "Leave blank for no link" }
          - { label: "Background Color", name: bg_color, widget: string, default: "#7b2d5e", hint: "Hex color, e.g. #7b2d5e" }
          - { label: "Text Color", name: text_color, widget: string, default: "#fde8c8", hint: "Hex color, e.g. #fde8c8" }

      - name: sidebar
        label: "📌 About This Place (Sidebar)"
        file: settings/sidebar.json
        format: json
        fields:
          - { label: "Sidebar Blurb", name: blurb, widget: text, hint: "Short text shown in the left sidebar under 'about this place'" }

      # settings/about.json (the legacy About bio) is deliberately no
      # longer editable from here — it's PRESERVE-only archived content
      # (CLAUDE.md), unrelated to the live About page's own copy, which
      # now has its own dedicated "about" collection below. The file
      # itself is untouched on disk.

      - name: wheel
        label: "🎡 Mood Wheel"
        file: settings/wheel.json
        format: json
        fields:
          - label: "Moods"
            name: moods
            widget: list
            hint: "Each mood becomes a wheel segment. Keep to 6–8 for best look."
            fields:
              - { label: "Mood Label", name: label, widget: string, hint: "e.g. nostalgic, euphoric, tender" }
              - { label: "Color", name: color, widget: string, hint: "Hex color for this segment, e.g. #7b4a8c" }
              - { label: "Why text", name: why, widget: string, hint: "Short description shown when wheel lands here" }

  # ── MUSIC SUPERVISION ──
  - name: supervision
    label: "🎬 Music Supervision"
    files:
      - name: supervision_content
        label: "Music Supervision Page"
        file: settings/supervision.json
        format: json
        fields:
          - { label: "Intro Paragraph", name: intro, widget: text }
          - { label: "Pull Quote", name: quote, widget: text }
          - label: "Pillars (key concepts)"
            name: pillars
            widget: list
            fields:
              - { label: "Label (small text above title)", name: label, widget: string }
              - { label: "Title", name: title, widget: string }
              - { label: "Body", name: body, widget: markdown }
          - label: "How It Works (steps)"
            name: steps
            widget: list
            fields:
              - { label: "Step Title", name: title, widget: string }
              - { label: "Step Description", name: body, widget: text }

  # ── LINKS ──
  - name: links_page
    label: "🔗 Links Page"
    files:
      - name: links_content
        label: "Links & Web Ring"
        file: settings/links.json
        format: json
        fields:
          - label: "Links"
            name: links
            widget: list
            fields:
              - { label: "Label", name: label, widget: string }
              - { label: "URL", name: url, widget: string, required: false, hint: "Leave blank to show as non-linked badge" }
          - { label: "Web Ring Label", name: webring_label, widget: string }
          - { label: "Web Ring Join Text", name: webring_email, widget: string }

  # ── ESSAYS ──
  - name: essays
    label: "✦ Essays"
    folder: essays
    create: true
    format: json
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Date", name: date, widget: date, format: YYYY-MM-DD }
      - { label: "Category", name: category, widget: string, default: essay }
      - { label: "Excerpt", name: excerpt, widget: text }
      - { label: "Body", name: body, widget: markdown }

  # ── MUSIC PICKS ──
  - name: music_picks
    label: "♪ Music Picks"
    files:
      - name: picks_index
        label: "All Music Picks"
        file: music-picks/index.json
        format: json
        fields:
          - label: "Picks"
            name: entries
            widget: list
            fields:
              - { label: "Song Title", name: title, widget: string }
              - { label: "Artist", name: artist, widget: string }
              - { label: "Year", name: year, widget: string, required: false }
              - { label: "Origin / Country", name: origin, widget: string, required: false }
              - label: "Genre Tags"
                name: genre
                widget: list
                field: { label: Genre, name: genre, widget: string }
              - { label: "Why this track?", name: why, widget: text }
              - { label: "Spotify URL", name: spotify, widget: string, required: false }

  # ── JOURNAL: ESSAYS ──
  # New Journal publishing system (PROJECT-SPEC.md §8). Distinct from the
  # legacy `essays` collection above, which remains PRESERVE-only and is
  # untouched. A real folder collection (one Markdown file per essay,
  # under content/journal/essays/) so Eleventy can build a native
  # `journalEssay` tag collection and generate a real /journal/<slug>/
  # page per entry — replaces the earlier single-JSON/list-widget shape.
  # `tags`/`layout`/`permalink` are implementation plumbing for the
  # Eleventy build, not something Sarah needs to set per essay, so
  # they're hidden fields with fixed defaults rather than exposed UI.
  - name: journal_essays
    label: "📓 Journal — Essays"
    folder: content/journal/essays
    create: true
    format: frontmatter
    extension: md
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Slug", name: slug, widget: string, hint: "Used in the URL as /journal/<slug>/. Lowercase, hyphenated, must be unique across both Essays and Monthly Favorites." }
      - { label: "Date", name: date, widget: date, format: "YYYY-MM-DD" }
      - { label: "Excerpt", name: excerpt, widget: text, hint: "Short teaser shown on the Journal card." }
      - { label: "Featured Image", name: featured_image, widget: image, required: false }
      - { label: "Show the whole Featured Image", name: featured_image_whole, widget: boolean, default: false, required: false, hint: "Turn on for polaroids and cut-outs so no edge gets cropped. Leave off for regular photos, which are cropped to fill the space." }
      - { label: "Category", name: category, widget: hidden, default: "Essay" }
      - { label: "Tags", name: tags, widget: hidden, default: "journalEssay" }
      - { label: "Layout", name: layout, widget: hidden, default: "layouts/journal-post.njk" }
      - { label: "Permalink", name: permalink, widget: hidden, default: "/journal/{{slug}}/" }
      - { label: "Body", name: body, widget: markdown, hint: "Renders into the Journal Post page's main body-copy block." }
      # Optional photo blocks on the Journal Post page. Each only renders
      # once an image is set. Hero sits above the body; the polaroids sit
      # below it on desktop.
      - label: "Hero Image (optional)"
        name: hero
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: "Image", name: image, widget: image, required: false }
          - { label: "Image position", name: position, widget: select, options: ["top", "center", "bottom"], default: "center", required: false, hint: "Which part of the photo stays visible when it is cropped to fit. Use top for portraits so faces are not cut off." }
          - { label: "Alt text", name: alt, widget: string, required: false, hint: "Describe the photo for screen readers." }
          - { label: "Caption", name: caption, widget: string, required: false }
      - label: "Polaroid 1 (optional)"
        name: polaroid1
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: "Image", name: image, widget: image, required: false }
          - { label: "Alt text", name: alt, widget: string, required: false, hint: "Describe the photo for screen readers." }
          - { label: "Caption", name: caption, widget: string, required: false }
      - label: "Polaroid 2 (optional)"
        name: polaroid2
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: "Image", name: image, widget: image, required: false }
          - { label: "Alt text", name: alt, widget: string, required: false, hint: "Describe the photo for screen readers." }
          - { label: "Caption", name: caption, widget: string, required: false }

  # ── JOURNAL: FEATURED ──
  # Ordered, explicitly-curated Featured Journal selection (replaces the
  # old always-newest-entry behavior). Today's Journal Landing template
  # only uses the first entry (the single Featured Post slot); later
  # entries are reserved for a possible future multi-featured layout.
  - name: journal_featured
    label: "📌 Journal — Featured Post"
    files:
      - name: featured_list
        label: "Featured Selections"
        file: content/journal/featured.json
        format: json
        fields:
          - label: "Featured (in order — the first one shows in the Featured Post slot)"
            name: entries
            widget: list
            summary: "{{type}} — {{slug}}"
            fields:
              - { label: "Type", name: type, widget: select, options: ["essay", "monthly-fav"] }
              - { label: "Slug", name: slug, widget: string, hint: "Must exactly match that entry's own Slug field." }

  # ── JOURNAL: MONTHLY FAVORITES ──
  # Same publishing system as Journal Essays above, but keeps its own
  # structured sections rather than a single markdown body.
  - name: journal_monthly_favorites
    label: "📓 Journal — Monthly Favorites"
    files:
      - name: monthly_favorites_list
        label: "All Monthly Favorites"
        file: content/journal/monthly-favorites.json
        format: json
        fields:
          - label: "Monthly Favorites Entries"
            name: entries
            widget: list
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Title", name: title, widget: string, hint: "e.g. August Favorites" }
              - { label: "Slug", name: slug, widget: string, hint: "Used in the URL as /journal/<slug>. Lowercase, hyphenated, must be unique across both Essays and Monthly Favorites." }
              - { label: "Date", name: date, widget: date, format: "YYYY-MM-DD" }
              - { label: "Excerpt", name: excerpt, widget: text, hint: "Short teaser shown on the Journal card." }
              - { label: "Featured Image", name: featured_image, widget: image, required: false }
              - { label: "Show the whole Featured Image", name: featured_image_whole, widget: boolean, default: false, required: false, hint: "Turn on for polaroids and cut-outs so no edge gets cropped. Leave off for regular photos, which are cropped to fill the space." }
              - label: "Hero Image (optional)"
                name: hero
                widget: object
                required: false
                collapsed: true
                fields:
                  - { label: "Image", name: image, widget: image, required: false }
                  - { label: "Image position", name: position, widget: select, options: ["top", "center", "bottom"], default: "center", required: false, hint: "Which part of the photo stays visible when it is cropped to fit. Use top for portraits so faces are not cut off." }
                  - { label: "Alt text", name: alt, widget: string, required: false, hint: "Describe the photo for screen readers." }
                  - { label: "Caption", name: caption, widget: string, required: false }
              - label: "Polaroid 1 (optional)"
                name: polaroid1
                widget: object
                required: false
                collapsed: true
                fields:
                  - { label: "Image", name: image, widget: image, required: false }
                  - { label: "Alt text", name: alt, widget: string, required: false, hint: "Describe the photo for screen readers." }
                  - { label: "Caption", name: caption, widget: string, required: false }
              - label: "Polaroid 2 (optional)"
                name: polaroid2
                widget: object
                required: false
                collapsed: true
                fields:
                  - { label: "Image", name: image, widget: image, required: false }
                  - { label: "Alt text", name: alt, widget: string, required: false, hint: "Describe the photo for screen readers." }
                  - { label: "Caption", name: caption, widget: string, required: false }
              - label: "New Releases I Loved"
                name: new_releases
                widget: list
                required: false
                fields:
                  - { label: "Song Title", name: title, widget: string }
                  - { label: "Artist", name: artist, widget: string }
                  - { label: "Note", name: note, widget: text, required: false }
              - label: "Favorite Songs"
                name: favorite_songs
                widget: list
                required: false
                fields:
                  - { label: "Song Title", name: title, widget: string }
                  - { label: "Artist", name: artist, widget: string }
                  - { label: "Note", name: note, widget: text, required: false }
              - label: "Favorite Discoveries"
                name: favorite_discoveries
                widget: list
                required: false
                fields:
                  - { label: "Song Title", name: title, widget: string }
                  - { label: "Artist", name: artist, widget: string }
                  - { label: "Note", name: note, widget: text, required: false }
              - label: "Favorite Needledrops"
                name: favorite_needledrops
                widget: list
                required: false
                fields:
                  - { label: "Song Title", name: title, widget: string }
                  - { label: "Artist", name: artist, widget: string }
                  - { label: "Note", name: note, widget: text, required: false }

  # ── ABOUT (current site) ──
  # content/about.json — the live About page's own copy (PROJECT-SPEC.md
  # §9). Distinct from the legacy settings/about.json bio above (removed
  # from this CMS's UI, PRESERVE-only). One bio is shared by desktop and
  # mobile; the remaining _desktop/_mobile pairs are formatted
  # differently per layout, so they stay separately editable.
  - name: about
    label: "👤 About (current site)"
    files:
      - name: about_content
        label: "About Page Content"
        file: content/about.json
        format: json
        fields:
          - label: "Desktop — Title Block"
            name: hero_desktop
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Heading Subtitle", name: heading_sub, widget: string }
          - label: "Desktop — Greeting"
            name: greeting_desktop
            widget: object
            fields:
              - { label: "Line 1", name: line1, widget: string }
              - { label: "Line 2", name: line2, widget: string }
          - label: "Mobile — Greeting"
            name: greeting_mobile
            widget: object
            fields:
              - { label: "Line 1", name: line1, widget: string }
              - { label: "Line 2", name: line2, widget: string }
          - label: "Bio (desktop and mobile)"
            name: bio
            widget: list
            summary: "{{text}}"
            fields:
              - { label: "Kind", name: kind, widget: hidden, default: "paragraph" }
              - { label: "Text", name: text, widget: text }
          - { label: "Polaroid Photo Caption (shared, desktop + mobile)", name: photo_caption, widget: string }
          - label: "Desktop — CTA"
            name: cta_desktop
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Body", name: body, widget: text }
          - label: "Resume"
            name: resume
            widget: object
            fields:
              - { label: "Heading (desktop)", name: heading_desktop, widget: string }
              - { label: "Heading (mobile)", name: heading_mobile, widget: string }
              - label: "Entries"
                name: entries
                widget: list
                fields:
                  - { label: "Title", name: title, widget: string }
                  - { label: "Role", name: role, widget: string }
                  - { label: "Dates (desktop)", name: dates_desktop, widget: string }
                  - { label: "Dates (mobile)", name: dates_mobile, widget: string }
          - label: "Mobile — Footer"
            name: footer_mobile
            widget: object
            fields:
              - { label: "Tagline", name: tagline, widget: string }
              - { label: "Copyright", name: copyright, widget: string }
